[project]
name = "llm-gateway"
version = "0.1.0"
description = "Incremental LLM Gateway learning project"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "httpx2>=2.16.0",
    "jsonschema>=4.23,<5",
    "openai>=3.42.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tokenizers>=0.23.3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
