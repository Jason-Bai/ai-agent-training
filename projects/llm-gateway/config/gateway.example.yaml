# F13完整示例：原两条Mock保留，新增三款真实百炼模型；使用前在独立凭据文件录入Key。
# 官方物理窗口为1000000；平台200000是避开Responses自动截断的保守窗口。
database:
  host: 127.0.0.1
  port: 15432
  name: llm_gateway
  username: llm_gateway
  password_file: postgres.password
providers:
  mock-main:
    adapter: mock
    api_protocol: chat_completions
  mock-backup:
    adapter: mock
    api_protocol: responses
  bailian-main:
    adapter: bailian
    api_protocol: responses
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    credential_ref: bailian-main-key
recovery:
  max_attempts: 3
  base_delay_seconds: 0.1
  max_delay_seconds: 1.0
  max_attempts_per_endpoint: 2
concurrency:
  max_requests: 20
  max_requests_per_agent: 5
endpoints:
  primary-chat:
    provider: mock-main
    model_id: deepseek-flash
    thinking_mode: disabled
    token_counter: deepseek_v41
    supports_streaming: true
    structured_output_mode: json_object
    context_window_tokens: 1048576
    provider_max_output_tokens: 393216
    max_output_tokens: 4096
    safety_margin_tokens: 1024
    max_timeout_seconds: 120
    enabled: true
  backup-responses:
    provider: mock-backup
    model_id: deepseek-flash
    thinking_mode: disabled
    token_counter: deepseek_v41
    supports_streaming: true
    structured_output_mode: json_schema
    context_window_tokens: 1048576
    provider_max_output_tokens: 393216
    max_output_tokens: 4096
    safety_margin_tokens: 1024
    max_timeout_seconds: 120
    enabled: true
  bailian-light:
    provider: bailian-main
    model_id: qwen3.8-flash
    thinking_mode: disabled
    enabled: true
    token_counter: qwen_text_estimate_v1
    supports_streaming: true
    structured_output_mode: json_schema
    context_window_tokens: 200000
    provider_max_output_tokens: 131072
    min_output_tokens: 16
    max_output_tokens: 4096
    safety_margin_tokens: 1024
    max_timeout_seconds: 120
  bailian-general:
    provider: bailian-main
    model_id: qwen3.7-plus
    thinking_mode: disabled
    enabled: true
    token_counter: qwen_text_estimate_v1
    supports_streaming: true
    structured_output_mode: json_schema
    context_window_tokens: 200000
    provider_max_output_tokens: 131072
    min_output_tokens: 16
    max_output_tokens: 4096
    safety_margin_tokens: 1024
    max_timeout_seconds: 120
  bailian-analysis:
    provider: bailian-main
    model_id: qwen3.8-max
    thinking_mode: disabled
    enabled: true
    token_counter: qwen_text_estimate_v1
    supports_streaming: true
    structured_output_mode: json_schema
    context_window_tokens: 200000
    provider_max_output_tokens: 131072
    min_output_tokens: 16
    max_output_tokens: 4096
    safety_margin_tokens: 1024
    max_timeout_seconds: 120
model_groups:
  general-primary:
    candidates:
    - primary-chat
    - backup-responses
    default_output_tokens: 1024
    max_output_tokens: 4096
    default_timeout_seconds: 30
    max_timeout_seconds: 120
  general-backup:
    candidates:
    - backup-responses
    default_output_tokens: 1024
    max_output_tokens: 4096
    default_timeout_seconds: 30
    max_timeout_seconds: 120
  light:
    candidates:
    - bailian-light
    routing_description: 提取、标签、简单改写
    default_output_tokens: 1024
    max_output_tokens: 4096
    default_timeout_seconds: 30
    max_timeout_seconds: 120
  general:
    candidates:
    - bailian-general
    routing_description: 依据明确资料回答与常规草稿
    default_output_tokens: 1024
    max_output_tokens: 4096
    default_timeout_seconds: 30
    max_timeout_seconds: 120
  analysis:
    candidates:
    - bailian-analysis
    routing_description: 冲突证据比较、多条件推导、处理路径比较
    default_output_tokens: 1024
    max_output_tokens: 4096
    default_timeout_seconds: 30
    max_timeout_seconds: 120
auto_routes:
  auto-general:
    classifier_group: light
    candidate_groups:
    - light
    - general
    - analysis
    default_group: general
    classifier_prompt:
      name: task_router
      version: 1.0.0
    classifier_timeout_seconds: 5
    classifier_max_output_tokens: 128
    default_output_tokens: 1024
    max_output_tokens: 4096
    default_timeout_seconds: 30
    max_timeout_seconds: 120
